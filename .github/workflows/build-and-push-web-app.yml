name: Build & Push challenge-web-app

# 只有 main 分支收到提交时构建并推送镜像；workflow_dispatch 用于手动补一次发布。
on:
  push:
    branches:
      - main
    # 纯文档改动不会影响镜像内容，跳过以免白烧构建额度
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.github/copilot-instructions.md'
  workflow_dispatch:

# 构建上下文必须是仓库根目录：Dockerfile 会 COPY packages/{challenge-web-app,challenge-agents,shared,database}
# 以及根 package.json / pnpm-lock.yaml / pnpm-workspace.yaml（路径必须与 lockfile 的 importer 键一致）。
env:
  REGISTRY: crpi-wz55upmk5eyo7jab.cn-shenzhen.personal.cr.aliyuncs.com
  IMAGE_NAME: quanta-challenge/quanta-challenge
  DOCKERFILE: packages/challenge-web-app/Dockerfile

# 同一分支连推多次时取消上一次未跑完的构建，避免旧提交的镜像后到覆盖新镜像
concurrency:
  group: build-and-push-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Nuxt + pnpm 全量安装的镜像动辄数个 GB，runner 默认磁盘常常在半路耗尽。
      # 先回收预装的 .NET / Android / CodeQL 等无用体积。
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune -af

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Aliyun Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Extract metadata (tags & labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # latest 供生产直接拉取，sha-<短哈希> 用于精确回滚到某次提交
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-,format=short
          labels: |
            org.opencontainers.image.title=quanta-challenge
            org.opencontainers.image.description=Quanta Challenge web application

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ env.DOCKERFILE }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # 层缓存放在 Actions Cache，重复构建时 pnpm install / nuxi prepare 可直接复用
          cache-from: type=gha,scope=web-app
          cache-to: type=gha,scope=web-app,mode=max
          provenance: false

      - name: Summary
        run: |
          {
            echo "### challenge-web-app 已推送"
            echo ""
            echo "| 项目 | 值 |"
            echo "| --- | --- |"
            echo "| 提交 | \`${{ github.sha }}\` |"
            echo "| 触发者 | @${{ github.actor }} |"
            echo "| digest | \`${{ steps.build.outputs.digest }}\` |"
            echo ""
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
