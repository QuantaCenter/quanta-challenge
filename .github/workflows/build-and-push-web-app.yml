name: Build & Push challenge-web-app

# 只有 main 分支收到提交时构建并推送镜像；workflow_dispatch 用于手动补一次发布。
on:
  push:
    branches:
      - main
    # 纯文档改动不会影响镜像内容，跳过以免白烧构建额度。注意：workflow 文件本身不在
    # 排除范围内 —— 改 CI 就该跑一次验证它。
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.github/copilot-instructions.md'
  workflow_dispatch:

# 构建上下文必须是仓库根目录：Dockerfile 会 COPY packages/{challenge-web-app,challenge-agents,shared,database}
# 以及根 package.json / pnpm-lock.yaml / pnpm-workspace.yaml（路径必须与 lockfile 的 importer 键一致）。
env:
  DOCKERFILE: packages/challenge-web-app/Dockerfile
  REGISTRY: ghcr.io

# 同一分支连推多次时取消上一次未跑完的构建，避免旧提交的镜像后到覆盖新镜像
concurrency:
  group: build-and-push-${{ github.ref }}
  cancel-in-progress: true

# 步骤划分的用意（对应「把构建拆细」的需求）：
#
# buildx 的 exporter 会把「压缩层 / 导出镜像 / 推送 blob / 导出 gha 缓存」全塞进同一个
# step，日志里只有一句 "exporting to image" 挂十几分钟，分不清慢在哪一段。因此这里把
# 重活（构建 + 推 sha 标签）、registry 侧核验、latest 指针发布拆成三个独立 step：
# 每个 step 的耗时在 UI 上单列，慢在哪一段一眼可见。
#
# 刻意**没有**采用「先 `load: true` 导出到本地 daemon 再 `docker push`」这种拆法：
# 那要求把整个镜像写进 runner 磁盘（多几 GB 占用与一次落盘），而缓存命中（常态）时
# 构建本身只要几秒，落盘反而会成为新的耗时大头 —— 纯为可读性加成本不划算。
# registry 侧的 `imagetools` 操作不重传层，打标签是秒级的。
jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      # 推 GHCR 需要的权限；缺了会在 push 阶段报 denied
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # GHCR 的仓库路径必须全小写，而 github.repository 保留原始大小写
      # （本仓库是 QuantaCenter/quanta-challenge，直接用会 push 失败），
      # 因此显式转小写：ghcr.io/quantacenter/quanta-challenge
      #
      # 标签不再走 docker/metadata-action：只有两个固定标签，手写更直观，
      # 也省掉一个「黑盒 action」在日志里的干扰。
      - name: Resolve image name & tags
        run: |
          echo "IMAGE=${REGISTRY}/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
          echo "TAG_SHA=sha-${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # GHCR 用 Actions 内置的 GITHUB_TOKEN 认证，不需要额外配置 secret。
      # 注意：镜像默认是 private，部署机拉取前要么把它设为 public
      # （Packages → 包页面 → Package settings → Change visibility），
      # 要么在部署机上用 PAT 执行 docker login ghcr.io。
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ---- 第 1 步：构建并推送 sha 标签（唯一的重活）----
      #
      # 只推 sha-<短哈希>，latest 留给后面的步骤打 —— 这样 latest 只在镜像确认推成功后
      # 才移动，构建中途失败时 latest 仍指向上一版可用镜像。
      - name: Build & push image (sha tag)
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ env.DOCKERFILE }}
          push: true
          tags: ${{ env.IMAGE }}:${{ env.TAG_SHA }}
          labels: |
            org.opencontainers.image.title=quanta-challenge
            org.opencontainers.image.description=Quanta Challenge web application
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          # 层缓存放在 Actions Cache，重复构建时 pnpm install / nuxi prepare 可直接复用
          cache-from: type=gha,scope=web-app
          cache-to: type=gha,scope=web-app,mode=max
          # 关掉 provenance attestation：减少一个额外的 attestation manifest，
          # 让镜像保持单 manifest，老版本 docker / 部分拉取工具兼容性更好
          provenance: false

      # ---- 第 2 步：从 registry 回读核验 ----
      #
      # 读的是远端 registry 而不是本地缓存（本地没有镜像可查，我们没做 --load），
      # 因此能证明「镜像真的推上去了」而不只是「构建成功」。
      - name: Verify pushed image
        run: |
          docker buildx imagetools inspect "$IMAGE:$TAG_SHA"
          {
            echo "### 推送产物"
            echo ""
            echo '```'
            docker buildx imagetools inspect "$IMAGE:$TAG_SHA"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # ---- 第 3 步：发布 latest 指针 ----
      #
      # imagetools create 是在 registry 侧新增一个指向同一 manifest 的标签引用，
      # 不会重传任何层（因此是秒级）。这也让它和「构建推送」的耗时对比很直观。
      - name: Publish latest tag
        run: |
          echo "::group::imagetools create -t $IMAGE:latest"
          docker buildx imagetools create -t "$IMAGE:latest" "$IMAGE:$TAG_SHA"
          echo "::endgroup::"

      - name: Summary
        run: |
          {
            echo ""
            echo "### 已推送到 GHCR"
            echo ""
            echo "| 项目 | 值 |"
            echo "| --- | --- |"
            echo "| 提交 | \`${{ github.sha }}\` |"
            echo "| 触发者 | @${{ github.actor }} |"
            echo "| digest | \`${{ steps.build.outputs.digest }}\` |"
            echo "| 标签 | \`latest\`、\`${{ env.TAG_SHA }}\` |"
            echo ""
            echo '```'
            echo "docker pull ${{ env.IMAGE }}:${{ env.TAG_SHA }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
