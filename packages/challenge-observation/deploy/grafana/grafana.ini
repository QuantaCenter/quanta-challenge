# 最小必要配置：其余通过环境变量（compose）与 provisioning 目录管理
[paths]
provisioning = /etc/grafana/provisioning
data = /var/lib/grafana

[server]
# root_url 由 GF_SERVER_ROOT_URL 环境变量覆盖
http_addr = 0.0.0.0
http_port = 3000

[users]
allow_sign_up = false
allow_org_create = false
default_theme = dark

[auth.anonymous]
enabled = false

[security]
admin_password = admin
disable_initial_admin_creation = false

[analytics]
reporting_enabled = false
check_for_updates = false

[unified_alerting]
enabled = true

[log]
level = warn
