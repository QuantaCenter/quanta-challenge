<!doctype html>
<html lang="zh-CN">
   <head>
      <meta charset="utf-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1" />
      <title>计数器：点击与状态联动</title>
      <style>
         :root {
            color-scheme: light dark;
            font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
         }
         body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            background: #f6f7f9;
            color: #1f2328;
         }
         .card {
            width: min(28rem, 90vw);
            padding: 2rem;
            border-radius: 1rem;
            background: #fff;
            box-shadow: 0 12px 32px rgb(15 23 42 / 12%);
         }
         h1 {
            margin: 0 0 1rem;
            font-size: 1.25rem;
         }
         .count {
            margin: 0 0 1rem;
            font-size: 1.5rem;
         }
         .actions {
            display: flex;
            gap: 0.75rem;
         }
         button {
            padding: 0.5rem 1rem;
            border-radius: 0.5rem;
            border: 1px solid #d0d7de;
            background: #fff;
            font-size: 1rem;
            cursor: pointer;
         }
         button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
         }
         #tip {
            min-height: 1.5rem;
            margin: 1rem 0 0;
            color: #1a7f37;
            font-weight: 600;
         }
      </style>
   </head>
   <body>
      <main class="card">
         <h1>计数器：点击与状态联动</h1>
         <p class="count">当前计数：<span id="count">0</span></p>
         <div class="actions">
            <button id="inc" type="button">+1</button>
            <button id="reset" type="button" disabled>重置</button>
         </div>
         <p id="tip"></p>
      </main>
      <script type="module">
         const countEl = document.querySelector('#count');
         const tipEl = document.querySelector('#tip');
         const incBtn = document.querySelector('#inc');
         const resetBtn = document.querySelector('#reset');

         let count = 0;

         const render = () => {
            countEl.textContent = String(count);
            tipEl.textContent = count >= 3 ? '已达标' : '';
            resetBtn.disabled = count === 0;
         };

         incBtn.addEventListener('click', () => {
            count += 1;
            render();
         });

         resetBtn.addEventListener('click', () => {
            count = 0;
            render();
         });

         render();

      </script>
   </body>
</html>
