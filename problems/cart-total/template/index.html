<!doctype html>
<html lang="zh-CN">
   <head>
      <meta charset="utf-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1" />
      <title>购物车合计</title>
      <style>
         :root {
            color-scheme: light dark;
            font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
         }
         body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            background: #f6f7f9;
            color: #1f2328;
         }
         .card {
            width: min(32rem, 92vw);
            padding: 2rem;
            border-radius: 1rem;
            background: #fff;
            box-shadow: 0 12px 32px rgb(15 23 42 / 12%);
         }
         h1 {
            margin: 0 0 1.25rem;
            font-size: 1.25rem;
         }
         table {
            width: 100%;
            border-collapse: collapse;
         }
         th,
         td {
            padding: 0.5rem 0.25rem;
            text-align: left;
            border-bottom: 1px solid #eaeef2;
         }
         th {
            font-size: 0.8125rem;
            color: #59636e;
            font-weight: 600;
         }
         td.price,
         td.subtotal {
            text-align: right;
            font-variant-numeric: tabular-nums;
         }
         td input {
            width: 4rem;
            padding: 0.25rem 0.5rem;
            border: 1px solid #d0d7de;
            border-radius: 0.375rem;
            font: inherit;
         }
         .footer {
            margin-top: 1.25rem;
         }
         .total {
            display: flex;
            justify-content: space-between;
            font-size: 1.125rem;
            font-weight: 700;
         }
         #discount-tip {
            min-height: 1.25rem;
            margin: 0.5rem 0 0;
            color: #1a7f37;
            font-size: 0.875rem;
         }
         .actions {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            margin-top: 1rem;
         }
         button {
            padding: 0.5rem 1rem;
            border-radius: 0.5rem;
            border: 1px solid #d0d7de;
            background: #fff;
            font-size: 1rem;
            cursor: pointer;
         }
         button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
         }
         #checkout-tip {
            min-height: 1.25rem;
            color: #1a7f37;
            font-size: 0.875rem;
         }
      </style>
   </head>
   <body>
      <main class="card">
         <h1>购物车</h1>
         <table>
            <thead>
               <tr>
                  <th>商品</th>
                  <th>单价</th>
                  <th>数量</th>
                  <th>小计</th>
               </tr>
            </thead>
            <tbody>
               <tr data-name="keyboard">
                  <td>机械键盘</td>
                  <td class="price" data-price="24.5">24.50</td>
                  <td>
                     <input
                        type="number"
                        name="keyboard"
                        min="1"
                        max="9"
                        value="2" />
                  </td>
                  <td class="subtotal" id="subtotal-keyboard"></td>
               </tr>
               <tr data-name="mouse">
                  <td>无线鼠标</td>
                  <td class="price" data-price="89">89.00</td>
                  <td>
                     <input
                        type="number"
                        name="mouse"
                        min="1"
                        max="9"
                        value="1" />
                  </td>
                  <td class="subtotal" id="subtotal-mouse"></td>
               </tr>
               <tr data-name="cable">
                  <td>数据线</td>
                  <td class="price" data-price="15.9">15.90</td>
                  <td>
                     <input
                        type="number"
                        name="cable"
                        min="1"
                        max="9"
                        value="3" />
                  </td>
                  <td class="subtotal" id="subtotal-cable"></td>
               </tr>
            </tbody>
         </table>

         <div class="footer">
            <div class="total">
               <span>合计</span>
               <span id="total"></span>
            </div>
            <p id="discount-tip"></p>
            <div class="actions">
               <button id="checkout" type="button">结算</button>
               <span id="checkout-tip"></span>
            </div>
         </div>
      </main>

      <script type="module">
         // TODO: 在这里实现购物车合计逻辑
         // 1) 每行：小计 = data-price × 对应 input 的值，写进 #subtotal-<name>
         // 2) 合计 = 三行小计之和，写进 #total，保留两位小数
         // 3) 合计 >= 100 时，#discount-tip 显示"已满 100 元，可享 9 折"，否则清空
         // 4) 数量输入变化时立刻重算
         // 5) 点击 #checkout，#checkout-tip 显示"结算成功"

      </script>
   </body>
</html>
