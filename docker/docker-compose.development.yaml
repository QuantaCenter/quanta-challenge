name: quanta-challenge

services:
  challenge-web-app:
    build:
      context: ../
      dockerfile: packages/challenge-web-app/Dockerfile
    networks:
      - quanta-challenge-network
    ports:
      - "3000:3000"
    environment:
      # 变量名必须与 nuxt.config.ts 中 process.env 读取的名称一致。
      # 原 NUXT_REDIS_HOST / NUXT_APP_BASE_SERVER / NUXT_JUDGE_SERVER_URL 与实际读取的
      # REDIS_HOST / APP_SERVER / JUDGE_SERVER 不匹配，等于从未生效。
      - DATABASE_URL=postgres://quanta:quanta@postgres:5432/quanta_db
      - REDIS_HOST=redis
      # 使用 http：开发环境走本地 HTTP，写 https 会让 cookie 的 secure 属性与协议不符
      - APP_SERVER=http://localhost:3000
      - JUDGE_SERVER=http://challenge-judge-scheduler:1888
      # 从 docker/.env 读取，避免把管理员口令写进版本库（可用 SUPER_ADMIN_PASSWORD 等覆盖）
      - SUPER_ACCOUNT=${SUPER_ADMIN_ACCOUNT:-stillsoda}
      - SUPER_PASSWORD=${SUPER_ADMIN_PASSWORD:-stillsoda123}
      - SUPER_EMAIL=${SUPER_ADMIN_EMAIL:-stillsoda123@admin.com}
      # Web 应用内嵌调度器代码，判题时会构建 Live Server 容器，
      # 同样需要 TEMP_DIR 指向与宿主机共享的目录（原因见调度器服务段）。
      - TEMP_DIR=/app/tmp
      # 运行时密钥：镜像构建期不再读取（原因见 server/plugins/validate-secrets.ts）。
      # 本地可写入仓库根目录的 .env，由 docker compose 读取。
      - ACCESS_TOKEN_SECRET=${ACCESS_TOKEN_SECRET:?请设置 ACCESS_TOKEN_SECRET（可写入仓库根目录 .env）}
      - REFRESH_TOKEN_SECRET=${REFRESH_TOKEN_SECRET:?请设置 REFRESH_TOKEN_SECRET（可写入仓库根目录 .env）}
      # 云函数服务：站点以内部密钥自动认证。开发环境默认值与云函数服务的
      # CF_INTERNAL_KEYS.web-app 一致，开箱可用。
      - CF_SERVER=http://challenge-cloud-function:1890
      - CF_INTERNAL_KEY_ID=web-app
      - CF_INTERNAL_SECRET=${CF_WEBAPP_SECRET:-dev_only_cloud_function_web_app}
    depends_on:
      - challenge-judge-scheduler
      - challenge-cloud-function
      - redis
      - postgres
    volumes:
      - qtc_app_storage:/app/packages/challenge-web-app/local_store # Persist local storage
      - /app/tmp:/app/tmp

  challenge-judge-scheduler:
    build:
      context: ../
      dockerfile: packages/challenge-judge-scheduler/Dockerfile
    environment:
      # 调度器的 src/index.ts 只在 NODE_ENV=production 时启动 HTTP 监听，
      # 缺失该变量会让容器起来但 1888 端口无人监听。
      - NODE_ENV=production
      - PORT=1888
      - DATABASE_URL=postgres://quanta:quanta@postgres:5432/quanta_db
      - REDIS_HOST=redis
      # 判题完成后调度器需回调 Web 应用同步排行榜与通知，缺失时会指向自身的 localhost:3000
      - APP_SERVER_URL=http://challenge-web-app:3000
      # 与 Web 应用共享同一个回调签名密钥；不一致会让所有回调被 403 拦掉
      - OPENAPI_WEBHOOK_SECRET=${OPENAPI_WEBHOOK_SECRET:-your_openapi_webhook_secret_here}
      # 调度器在容器里，容器内的 localhost 指向自身，必须走 host.docker.internal
      # 才能连到宿主机上映射出来的判题机端口 1889。
      - JUDGE_MACHINE_WS_URL=ws://host.docker.internal:1889/link
      # 云函数服务：判题侧内部密钥自动认证，受 CF_JUDGE_ALLOWED_FUNCTIONS 白名单约束。
      - CF_SERVER=http://challenge-cloud-function:1890
      - CF_INTERNAL_KEY_ID=judge
      - CF_INTERNAL_SECRET=${CF_JUDGE_SECRET:-dev_only_cloud_function_judge}
      # 判题快照目录：必须是容器与宿主机都能解析的同一路径。
      # 调度器把快照写到本地后，会把该路径作为 bind mount 的 Source 交给宿主机的
      # Docker daemon —— daemon 按宿主机文件系统解析，容器私有路径必然失败：
      #   invalid mount config for type "bind": bind source path does not exist
      - TEMP_DIR=/app/tmp
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - redis
      - postgres
    networks:
      - quanta-challenge-network
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock # Docker outside of Docker
      # 必须与 Web 应用共用同一个 local_store，否则调度器写出的题目封面
      # （判题首屏截图）Web 端 /api/static 读不到，所有封面都 404。
      - qtc_app_storage:/app/packages/challenge-web-app/local_store
      - /app/tmp:/app/tmp

  challenge-cloud-function:
    build:
      context: ../
      dockerfile: packages/challenge-cloud-function/Dockerfile
    environment:
      - NODE_ENV=production
      - PORT=1890
      - DATABASE_URL=postgres://quanta:quanta@postgres:5432/quanta_db
      - REDIS_HOST=redis
      # 开发默认值与 web-app / 调度器侧的 CF_INTERNAL_SECRET 一致，开箱可用。
      - CF_INTERNAL_KEYS=${CF_INTERNAL_KEYS:-{"web-app":"dev_only_cloud_function_web_app","judge":"dev_only_cloud_function_judge"}}
      - CF_MASTER_SECRETS=${CF_MASTER_SECRETS:-{"1":"dev_only_cloud_function_master"}}
      - CF_JUDGE_ALLOWED_FUNCTIONS=${CF_JUDGE_ALLOWED_FUNCTIONS:-}
    depends_on:
      - redis
      - postgres
    networks:
      - quanta-challenge-network

  challenge-judge-machine-agent:
    build:
      context: ../
      dockerfile: packages/challenge-agents/judge-machine/Dockerfile
    profiles:
      - ignore
    extra_hosts:
      - "host.docker.internal:host-gateway"

  challenge-live-server-agent:
    build:
      context: ../
      dockerfile: packages/challenge-agents/live-server/Dockerfile
    profiles:
      - ignore

  redis:
    image: "redis:7-alpine"
    ports:
      - "26379:6379"
    # Docker Desktop 重启 / 机器休眠唤醒后容器不会自动回来。
    # 没有这条策略时的典型症状：Web 能打开，但所有数据库操作报错、调度器静默不工作。
    restart: unless-stopped
    networks:
      - quanta-challenge-network

  postgres:
    image: "postgres:16-alpine"
    restart: unless-stopped
    environment:
      - POSTGRES_USER=quanta
      - POSTGRES_PASSWORD=quanta
      - POSTGRES_DB=quanta_db
    ports:
      - "25432:5432"
    networks:
      - quanta-challenge-network
    volumes:
      - qtc_postgres_data:/var/lib/postgresql/data

networks:
  quanta-challenge-network:
    driver: bridge

volumes:
  qtc_postgres_data:
  qtc_app_storage:
