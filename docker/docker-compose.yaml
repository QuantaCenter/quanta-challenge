name: quanta-challenge

services:
  challenge-web-app:
    build:
      context: ../
      dockerfile: packages/challenge-web-app/Dockerfile
    networks:
      - quanta-challenge-network
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgres://quanta:quanta@postgres:5432/quanta_db
      - REDIS_HOST=redis
      - APP_SERVER=${APP_SERVER:?请设置 APP_SERVER，例如 https://your-domain.example}
      - JUDGE_SERVER=http://challenge-judge-scheduler:1888
      - SUPER_ACCOUNT=${SUPER_ADMIN_ACCOUNT:?请设置 SUPER_ADMIN_ACCOUNT}
      - SUPER_PASSWORD=${SUPER_ADMIN_PASSWORD:?请设置 SUPER_ADMIN_PASSWORD}
      - SUPER_EMAIL=${SUPER_ADMIN_EMAIL:-${SUPER_ADMIN_ACCOUNT}@super.admin}
      - TEMP_DIR=/app/tmp
      - ACCESS_TOKEN_SECRET=${ACCESS_TOKEN_SECRET:?请设置 ACCESS_TOKEN_SECRET}
      - REFRESH_TOKEN_SECRET=${REFRESH_TOKEN_SECRET:?请设置 REFRESH_TOKEN_SECRET}
      # OAuth secret is runtime/server-only; keep disabled until HTTPS integration passes.
      - QUANTA_OAUTH_ENABLED=${QUANTA_OAUTH_ENABLED:-false}
      - QUANTA_OAUTH_ISSUER=${QUANTA_OAUTH_ISSUER:-https://www.example.com}
      - QUANTA_OAUTH_APP_ORIGIN=${QUANTA_OAUTH_APP_ORIGIN:-https://challenge.example.com}
      - QUANTA_OAUTH_CLIENT_ID=${QUANTA_OAUTH_CLIENT_ID:-quanta-challenge}
      - QUANTA_OAUTH_CLIENT_SECRET=${QUANTA_OAUTH_CLIENT_SECRET:-}
      - CF_SERVER=http://challenge-cloud-function:1890
      - CF_INTERNAL_KEY_ID=web-app
      - CF_INTERNAL_SECRET=${CF_WEBAPP_SECRET:?请设置 CF_WEBAPP_SECRET}
      # 前端监控上报代理目标
      - OBSERVATION_SERVER_URL=${OBSERVATION_SERVER_URL:-http://observation:9310}
      - OBSERVATION_REPORT_TOKEN=${OBS_REPORT_TOKEN:-}
      - RELEASE_VERSION=${RELEASE_VERSION:-}
      # Sentry：DSN 直指 observation 服务的 Envelope 端点。服务端 SDK（sentry.server.config.ts）
      # 启动时直读 process.env；浏览器端事件走 tunnel 代理，DSN 仅作事件元数据。
      # 未设置 SENTRY_DSN 时服务端监控完全静默，浏览器端用构建期默认值。
      - SENTRY_DSN=${SENTRY_DSN:-http://challenge_web_app@observation:9310/1}
      - SENTRY_ENVIRONMENT=${SENTRY_ENVIRONMENT:-production}
      - SENTRY_TRACES_SAMPLE_RATE=${SENTRY_TRACES_SAMPLE_RATE:-0.1}
      # nuxt build 会把 runtimeConfig 烘焙成字面量，运行时只有 NUXT_ 前缀的变量能覆盖
      # （Nitro 按 runtimeConfig 键路径映射 NUXT_<KEY>），compose 里只配原名读不到，
      # 上报会一直打默认的 http://localhost:9310。这里必须同时注入 NUXT_ 键。
      - NUXT_OBSERVATION_SERVER_URL=${OBSERVATION_SERVER_URL:-http://observation:9310}
      - NUXT_PUBLIC_SENTRY_DSN=${SENTRY_DSN:-http://challenge_web_app@observation:9310/1}
      - NUXT_PUBLIC_SENTRY_RELEASE=${RELEASE_VERSION:-}
      - NUXT_PUBLIC_SENTRY_ENVIRONMENT=${SENTRY_ENVIRONMENT:-production}
    depends_on:
      - challenge-judge-scheduler
      - challenge-cloud-function
      - redis
      - postgres
    volumes:
      - qtc_app_storage:/app/packages/challenge-web-app/local_store # Persist local storage
      - /app/tmp:/app/tmp

  challenge-judge-scheduler:
    build:
      context: ../
      dockerfile: packages/challenge-judge-scheduler/Dockerfile
    environment:
      # 调度器的 src/index.ts 只在 NODE_ENV=production 时启动 HTTP 监听
      - NODE_ENV=production
      - PORT=1888
      - DATABASE_URL=postgres://quanta:quanta@postgres:5432/quanta_db
      - REDIS_HOST=redis
      - APP_SERVER_URL=http://challenge-web-app:3000
      - OPENAPI_WEBHOOK_SECRET=${OPENAPI_WEBHOOK_SECRET:?请设置 OPENAPI_WEBHOOK_SECRET}
      - JUDGE_MACHINE_WS_URL=ws://host.docker.internal:1889/link
      # 后端题型判题机容器映射到宿主机 1891，与前端判题机（1889）分开，
      # 两者的任务信封与回包格式一致，只是沙箱能力不同（见 docs/BACKEND_SERVICE_PROBLEM.md）。
      - BACKEND_JUDGE_MACHINE_WS_URL=ws://host.docker.internal:1891/link
      - CF_SERVER=http://challenge-cloud-function:1890
      - CF_INTERNAL_KEY_ID=judge
      - CF_INTERNAL_SECRET=${CF_JUDGE_SECRET:?请设置 CF_JUDGE_SECRET}
      - TEMP_DIR=/app/tmp
      # 共享 pnpm 缓存：固定路径，调度器是唯一写入方（通过 /cache/update 预热）。
      # 题目容器用同一个宿主机路径做【只读】挂载（见 services/pnpm-cache.ts）。
      - PNPM_CACHE_DIR=/app/pnpm-cache
      # 预热 / 门禁用哪个镜像起容器。必须是【题目容器镜像】：
      # pnpm 缓存的 postinstall 产物（如 Prisma 引擎）依赖 openssl/libc/arch，
      # 用别的镜像预热会在题目容器里 miss。不设置则退化为调度器进程内预热（仅调试）。
      - PNPM_CACHE_PROBLEM_IMAGE=${PNPM_CACHE_PROBLEM_IMAGE:-}
    extra_hosts:
      # Linux 上 host.docker.internal 默认不存在，需要显式注入 host-gateway
      - "host.docker.internal:host-gateway"
    depends_on:
      - redis
      - postgres
    networks:
      - quanta-challenge-network
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock # Docker outside of Docker
      - qtc_app_storage:/app/packages/challenge-web-app/local_store
      - /app/tmp:/app/tmp
      # pnpm 缓存：宿主机路径与容器内路径保持一致，这样调度器创建题目容器时
      # 可以直接把这个路径当作 bind mount 的 Source（daemon 按宿主机解析）。
      - ${PNPM_CACHE_HOST_DIR:-/app/pnpm-cache}:/app/pnpm-cache

  challenge-cloud-function:
    build:
      context: ../
      dockerfile: packages/challenge-cloud-function/Dockerfile
    networks:
      - quanta-challenge-network
    ports:
      # 只绑回环：部署机上的 webhook 用 http://127.0.0.1:1890/healthz 做健康探测
      # （与调度器的 1888 同理）。服务本身只需被 compose 网络内的 web-app /
      # 调度器访问，不要暴露到 0.0.0.0。
      - "127.0.0.1:1890:1890"
    environment:
      - NODE_ENV=production
      - PORT=1890
      - DATABASE_URL=postgres://quanta:quanta@postgres:5432/quanta_db
      - REDIS_HOST=redis
      - CF_INTERNAL_KEYS=${CF_INTERNAL_KEYS:?请设置 CF_INTERNAL_KEYS（JSON，例如 {"web-app":"…","judge":"…"}）}
      - CF_MASTER_SECRETS=${CF_MASTER_SECRETS:?请设置 CF_MASTER_SECRETS（JSON，例如 {"1":"…"}）}
      - CF_JUDGE_ALLOWED_FUNCTIONS=${CF_JUDGE_ALLOWED_FUNCTIONS:-}
    depends_on:
      - redis
      - postgres

  challenge-judge-machine-agent:
    build:
      context: ../
      dockerfile: packages/challenge-agents/judge-machine/Dockerfile
    profiles:
      - ignore
    extra_hosts:
      - "host.docker.internal:host-gateway"

  challenge-live-server-agent:
    build:
      context: ../
      dockerfile: packages/challenge-agents/live-server/Dockerfile
    profiles:
      - ignore

  # 后端服务题型：Node 24 题目容器镜像（注册表 id `node-24`、展示名「Node.js 24」，
  # 见 packages/shared/service/backend-service-image.ts；换镜像要同时加注册表条目）
  challenge-backend-service-agent:
    build:
      context: ../
      dockerfile: packages/challenge-agents/backend-service/Dockerfile
    profiles:
      - ignore

  # 后端服务题型：判题机镜像（懒加载，只有后端题目会用到）
  challenge-backend-judge-machine-agent:
    build:
      context: ../
      dockerfile: packages/challenge-agents/backend-judge-machine/Dockerfile
    profiles:
      - ignore
    extra_hosts:
      - "host.docker.internal:host-gateway"

  redis:
    image: "redis:7-alpine"
    ports:
      - "26379:6379"
    # 宿主机/Docker 重启后自动恢复，否则 Web 会"看似正常"而所有数据库操作失败
    restart: unless-stopped
    networks:
      - quanta-challenge-network

  postgres:
    image: "postgres:16-alpine"
    restart: unless-stopped
    environment:
      - POSTGRES_USER=quanta
      - POSTGRES_PASSWORD=quanta
      - POSTGRES_DB=quanta_db
    ports:
      - "25432:5432"
    networks:
      - quanta-challenge-network
    volumes:
      - qtc_postgres_data:/var/lib/postgresql/data

networks:
  quanta-challenge-network:
    driver: bridge

volumes:
  qtc_postgres_data:
  qtc_app_storage:
