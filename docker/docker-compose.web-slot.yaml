# Web 蓝绿 slot：与主栈共用 prod.env，独立 compose 项目（qc-web-blue / qc-web-green）。
# webhook 注入 WEB_APP_REF、WEB_SLOT_HOST_PORT、WEB_SLOT_NETWORK_ALIAS。
# 注意：!reset 会忽略后面写的值、直接清空字段；要替换成新值必须用 !override。
services:
  challenge-web-app:
    build: !reset null
    image: ${WEB_APP_REF:?请设置 WEB_APP_REF}
    depends_on: !reset []
    ports: !override
      - "127.0.0.1:${WEB_SLOT_HOST_PORT:?请设置 WEB_SLOT_HOST_PORT}:3000"
    networks: !override
      quanta-challenge-network:
        # 调度器回调（APP_SERVER_URL）与 Prometheus 都按服务名 challenge-web-app 访问。
        # 两个 slot 并存的几十秒里 DNS 会返回两个 IP，两者都已通过探活。
        aliases:
          - challenge-web-app
          - ${WEB_SLOT_NETWORK_ALIAS:-challenge-web-app-slot}
    volumes: !override
      - qtc_app_storage:/app/packages/challenge-web-app/local_store
      - /app/tmp:/app/tmp

networks:
  quanta-challenge-network: !override
    external: true
    name: ${WEB_BG_NETWORK:-quanta-challenge_quanta-challenge-network}

volumes:
  qtc_app_storage: !override
    external: true
    name: ${WEB_BG_VOLUME:-quanta-challenge_qtc_app_storage}
